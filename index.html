<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>freezers</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-color: #f2f4f7;
            --card-bg: #ffffff;
            --text-main: #0f172a;
            --text-sub: #64748b;
            --accent-blue: #2563eb;
            --border-color: #e2e8f0;
            --star-gold: #f59e0b;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background-color: var(--bg-color); color: var(--text-main); padding: 16px; padding-bottom: 80px; }

        .header-title { font-size: 26px; font-weight: 800; margin-bottom: 16px; }
        .tab-content { display: none; }
        .tab-content.active { display: block; }

        /* Чипсы переключения способов оплаты */
        .currency-selector { display: flex; gap: 8px; margin-bottom: 16px; overflow-x: auto; padding-bottom: 4px; }
        .curr-chip { background: #e2e8f0; color: var(--text-sub); padding: 8px 14px; border-radius: 20px; font-size: 13px; font-weight: 700; cursor: pointer; white-space: nowrap; border: none; }
        .curr-chip.active { background: var(--accent-blue); color: #fff; }

        /* Карточки старого интерфейса */
        .card { background: var(--card-bg); border-radius: 18px; padding: 18px; margin-bottom: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.03); }
        .card-title { font-size: 13px; color: var(--text-sub); margin-bottom: 6px; }
        .card-value { font-size: 18px; font-weight: 700; display: flex; align-items: center; gap: 8px; }

        /* Кнопки */
        .btn-main { width: 100%; background: var(--accent-blue); color: #fff; border: none; padding: 14px; border-radius: 14px; font-size: 15px; font-weight: 700; cursor: pointer; margin-bottom: 8px; text-align: center; }
        .btn-sub { width: 100%; background: #fff; color: var(--text-main); border: 1px solid var(--border-color); padding: 14px; border-radius: 14px; font-size: 15px; font-weight: 700; cursor: pointer; text-align: center; }

        .checkbox-row { display: flex; justify-content: space-between; align-items: center; font-weight: 600; font-size: 14px; }
        .checkbox-row input { width: 18px; height: 18px; accent-color: var(--accent-blue); }

        /* Нижнее меню */
        .bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; background: #fff; display: flex; justify-content: space-around; padding: 10px 0; border-top: 1px solid var(--border-color); z-index: 100; }
        .nav-btn { display: flex; flex-direction: column; align-items: center; gap: 4px; color: var(--text-sub); font-size: 11px; font-weight: 600; cursor: pointer; width: 25%; border: none; background: none; }
        .nav-btn.active { color: var(--accent-blue); }

        .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 12px; }
        .stat-box { background: var(--card-bg); padding: 14px; border-radius: 14px; }
        .stat-num { font-size: 20px; font-weight: 800; margin-top: 4px; }

        /* Окно пополнения */
        .modal { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.5); align-items: center; justify-content: center; padding: 16px; z-index: 200; }
        .modal.active { display: flex; }
        .modal-body { background: #fff; border-radius: 20px; padding: 20px; width: 100%; max-width: 360px; }
        .input-field { width: 100%; padding: 12px; border: 1px solid var(--border-color); border-radius: 10px; font-size: 15px; margin: 10px 0 16px 0; outline: none; }
    </style>
</head>
<body>

    <!-- Вкладка Сделки -->
    <div id="tab-deals" class="tab-content active">
        <h1 class="header-title">Мои сделки</h1>
        <button class="btn-main">+ Создать сделку</button>
        
        <div style="display: flex; gap: 10px; margin-bottom: 12px;">
            <div class="card" style="flex: 1; margin: 0;"><div class="card-title">Активные</div><div style="font-weight:700;">Текущие сделки</div></div>
            <div class="card" style="flex: 1; margin: 0;"><div class="card-title">История</div><div style="font-weight:700;">Завершённые</div></div>
        </div>

        <div class="card">
            <div class="card-title" style="margin-bottom: 10px;">Присоединиться по коду</div>
            <input type="text" placeholder="ABC123" class="input-field" style="margin: 0 0 10px 0; text-align: center; font-weight: 700;">
            <button class="btn-sub">Войти в сделку</button>
        </div>
    </div>

    <!-- Вкладка Кошельки (Сбор способов оплаты) -->
    <div id="tab-wallets" class="tab-content">
        <h1 class="header-title">Мои кошельки</h1>
        
        <!-- Кнопки переключения способов оплаты -->
        <div class="currency-selector">
            <button class="curr-chip active" onclick="selectCurrency('ton', '💎 TON', 'Toncoin', '0 TON', this)">💎 TON</button>
            <button class="curr-chip" onclick="selectCurrency('usdt', '💵 USDT', 'Tether', '0 USDT', this)">💵 USDT</button>
            <button class="curr-chip" onclick="selectCurrency('stars', '⭐ STARS', 'Telegram Stars', '0 ⭐', this)">⭐ STARS</button>
            <button class="curr-chip" onclick="selectCurrency('rub', '₽ RUB', 'Рубли', '0 ₽', this)">₽ RUB</button>
        </div>

        <div class="card">
            <div class="card-title" id="curr-label">Кошелёк TON</div>
            <div class="card-value" id="curr-value">Toncoin <span style="margin-left: auto; color: var(--text-sub);" id="curr-balance">0 TON</span></div>
        </div>

        <button class="btn-main" onclick="openDepositModal()">Пополнить</button>
        <button class="btn-sub" style="margin-bottom: 12px;">Вывести</button>

        <div class="card checkbox-row">
            <span>Скрыть нулевые</span>
            <input type="checkbox" checked>
        </div>
    </div>

    <!-- Вкладка Лидеры -->
    <div id="tab-leaders" class="tab-content">
        <h1 class="header-title">Лидеры</h1>
        <div class="card">
            <div style="font-weight: 700;">Лидер недели: Username123</div>
            <div style="font-size: 13px; color: var(--text-sub);">Объем: 15,000 TON</div>
        </div>
    </div>

    <!-- Вкладка Профиль -->
    <div id="tab-profile" class="tab-content">
        <div style="text-align: center; margin: 20px 0;">
            <h2 id="profile-name">Freezers</h2>
            <div style="color: var(--star-gold); font-weight: 600;" id="profile-tag">@Freezers1</div>
        </div>
        <div class="stats-grid">
            <div class="stat-box"><div class="card-title">Успешных</div><div class="stat-num">0</div></div>
            <div class="stat-box"><div class="card-title">Активных</div><div class="stat-num">0</div></div>
        </div>
    </div>

    <!-- Модальное окно пополнения -->
    <div id="deposit-modal" class="modal">
        <div class="modal-body">
            <h3 style="margin-bottom: 8px;" id="modal-title">Пополнить баланс</h3>
            <p style="font-size: 13px; color: var(--text-sub);">Укажите сумму пополнения:</p>
            <input type="number" id="deposit-amount" class="input-field" placeholder="Введите сумму" value="50">
            <button class="btn-main" onclick="submitDeposit()">Оплатить</button>
            <button class="btn-sub" onclick="closeModal()">Отмена</button>
        </div>
    </div>

    <!-- Нижняя навигация -->
    <div class="bottom-nav">
        <button class="nav-btn active" onclick="switchTab('deals', this)"><span>Сделки</span></button>
        <button class="nav-btn" onclick="switchTab('wallets', this)"><span>Кошельки</span></button>
        <button class="nav-btn" onclick="switchTab('leaders', this)"><span>Лидеры</span></button>
        <button class="nav-btn" onclick="switchTab('profile', this)"><span>Профиль</span></button>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.ready(); tg.expand();

        let selectedCurr = 'ton';

        function switchTab(tabId, btn) {
            document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
            document.getElementById('tab-' + tabId).classList.add('active');
            btn.classList.add('active');
        }

        function selectCurrency(code, label, name, balance, btn) {
            document.querySelectorAll('.curr-chip').forEach(c => c.classList.remove('active'));
            btn.classList.add('active');
            selectedCurr = code;
            
            document.getElementById('curr-label').innerText = 'Кошелёк ' + label;
            document.getElementById('curr-value').innerHTML = name + `<span style="margin-left: auto; color: var(--text-sub);">${balance}</span>`;
        }

        function openDepositModal() {
            if(selectedCurr === 'stars') {
                document.getElementById('modal-title').innerText = 'Пополнить ⭐ Stars';
            } else {
                document.getElementById('modal-title').innerText = 'Пополнить ' + selectedCurr.toUpperCase();
            }
            document.getElementById('deposit-modal').classList.add('active');
        }

        function closeModal() {
            document.getElementById('deposit-modal').classList.remove('active');
        }

        function submitDeposit() {
            const amount = document.getElementById('deposit-amount').value;
            if(!amount || amount <= 0) {
                tg.showAlert("Введите корректную сумму");
                return;
            }

            if (selectedCurr === 'stars') {
                tg.sendData(JSON.stringify({
                    action: "pay_stars",
                    amount: parseInt(amount)
                }));
                closeModal();
                tg.close();
            } else {
                tg.showAlert(`Способ оплаты ${selectedCurr.toUpperCase()} находится в разработке. Используйте STARS.`);
            }
        }
    </script>
</body>
</html>
