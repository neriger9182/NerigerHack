<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>freezers Mini App</title>
    <!-- Telegram WebApp SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent-color: #38bdf8;
            --text-color: #f8fafc;
            --text-muted: #94a3b8;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 16px;
            box-sizing: border-box;
        }

        .header {
            text-align: center;
            margin-bottom: 24px;
        }

        .header h1 {
            font-size: 24px;
            margin: 0;
            color: var(--accent-color);
        }

        .card {
            background-color: var(--card-bg);
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 16px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        .card h2 {
            font-size: 18px;
            margin-top: 0;
            margin-bottom: 12px;
        }

        .form-group {
            margin-bottom: 12px;
        }

        label {
            display: block;
            font-size: 14px;
            color: var(--text-muted);
            margin-bottom: 4px;
        }

        input {
            width: 100%;
            padding: 10px;
            border-radius: 8px;
            border: 1px solid #334155;
            background-color: #0f172a;
            color: #fff;
            box-sizing: border-box;
            font-size: 14px;
        }

        button {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 8px;
            background-color: var(--accent-color);
            color: #0f172a;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        button:active {
            opacity: 0.8;
        }

        .deal-item {
            border-bottom: 1px solid #334155;
            padding: 8px 0;
            display: flex;
            justify-content: space-between;
        }

        .deal-item:last-child {
            border-bottom: none;
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>🛡️ freezers</h1>
        <p id="user-welcome" style="color: var(--text-muted); font-size: 14px;">Загрузка профиля...</p>
    </div>

    <!-- Форма создания сделки -->
    <div class="card">
        <h2>Создать сделку</h2>
        <div class="form-group">
            <label for="deal-title">Название предмета / услуги</label>
            <input type="text" id="deal-title" placeholder="Например: Telegram Premium 1 год">
        </div>
        <div class="form-group">
            <label for="deal-amount">Сумма (TON)</label>
            <input type="number" id="deal-amount" placeholder="0.00">
        </div>
        <button id="create-deal-btn">Создать сделку</button>
    </div>

    <!-- Мои сделки (Профиль) -->
    <div class="card">
        <h2>Мои активные сделки</h2>
        <div id="deals-list">
            <p style="color: var(--text-muted); font-size: 14px;">У вас пока нет активных сделок.</p>
        </div>
    </div>

    <script>
        // Инициализация Telegram WebApp
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();

        // Отображение данных пользователя из Telegram
        const user = tg.initDataUnsafe?.user;
        const userWelcome = document.getElementById('user-welcome');
        if (user) {
            userWelcome.innerText = `Пользователь: ${user.first_name} (@${user.username || 'no_username'})`;
        } else {
            userWelcome.innerText = 'Запущено вне Telegram';
        }

        // Загрузка сделок из локальной памяти браузера
        function loadDeals() {
            const dealsList = document.getElementById('deals-list');
            const savedDeals = JSON.parse(localStorage.getItem('freezers_deals') || '[]');

            if (savedDeals.length === 0) {
                dealsList.innerHTML = '<p style="color: var(--text-muted); font-size: 14px;">У вас пока нет активных сделок.</p>';
                return;
            }

            dealsList.innerHTML = '';
            savedDeals.forEach((deal) => {
                const item = document.createElement('div');
                item.className = 'deal-item';
                item.innerHTML = `
                    <div>
                        <strong>${deal.title}</strong><br>
                        <small style="color: var(--text-muted);">${deal.date}</small>
                    </div>
                    <div style="color: var(--accent-color); font-weight: bold;">
                        ${deal.amount} TON
                    </div>
                `;
                dealsList.appendChild(item);
            });
        }

        // Создание новой сделки
        document.getElementById('create-deal-btn').addEventListener('click', () => {
            const titleInput = document.getElementById('deal-title');
            const amountInput = document.getElementById('deal-amount');

            const title = titleInput.value.trim();
            const amount = amountInput.value.trim();

            if (!title || !amount) {
                tg.showAlert("Заполните название и сумму сделки!");
                return;
            }

            const newDeal = {
                title: title,
                amount: amount,
                date: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
            };

            // Сохраняем в память устройства
            const savedDeals = JSON.parse(localStorage.getItem('freezers_deals') || '[]');
            savedDeals.unshift(newDeal);
            localStorage.setItem('freezers_deals', JSON.stringify(savedDeals));

            // Обновляем список на экране
            loadDeals();

            // Отправляем сообщение боту
            tg.sendData(JSON.stringify({
                action: "create_deal",
                title: title,
                amount: amount
            }));

            // Очищаем поля
            titleInput.value = '';
            amountInput.value = '';

            tg.showAlert("Сделка создана и добавлена в ваш профиль!");
        });

        // Загружаем сделки при открытии
        loadDeals();
    </script>
</body>
</html>
