<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hacker Terminal</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #000;
            color: #00ff66;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
        }

        canvas {
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }

        .container {
            position: relative;
            z-index: 2;
            background: rgba(0, 20, 0, 0.85);
            border: 2px solid #00ff66;
            box-shadow: 0 0 15px #00ff66;
            border-radius: 10px;
            padding: 20px;
            width: 85%;
            max-width: 400px;
            text-align: center;
        }

        h1 {
            font-size: 1.5rem;
            margin-bottom: 10px;
            text-shadow: 0 0 8px #00ff66;
        }

        .status {
            font-size: 0.9rem;
            margin-bottom: 20px;
            color: #88ff88;
        }

        .btn {
            background: transparent;
            color: #00ff66;
            border: 1px solid #00ff66;
            padding: 12px 20px;
            font-family: inherit;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 5px;
            cursor: pointer;
            box-shadow: 0 0 5px #00ff66;
            transition: all 0.2s ease;
            width: 100%;
            margin-top: 10px;
        }

        .btn:active {
            background-color: #00ff66;
            color: #000;
            box-shadow: 0 0 20px #00ff66;
        }
    </style>
</head>
<body>

    <canvas id="canvas"></canvas>

    <div class="container">
        <h1 id="user-name">SYSTEM ACCESS</h1>
        <div class="status" id="status-text">> Waiting for command...</div>
        
        <button class="btn" onclick="runHack()">[ HACK SYSTEM ]</button>
        <button class="btn" onclick="closeApp()">[ EXIT ]</button>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand(); // Разворачивает окно на весь экран

        // Вывод имени пользователя из Telegram
        if (tg.initDataUnsafe && tg.initDataUnsafe.user) {
            document.getElementById('user-name').innerText = `USER: ${tg.initDataUnsafe.user.first_name}`;
        }

        function runHack() {
            const status = document.getElementById('status-text');
            status.innerText = "> Bypassing firewall...";
            setTimeout(() => { status.innerText = "> Extracting data..."; }, 1000);
            setTimeout(() => { 
                status.innerText = "> ACCESS GRANTED"; 
                tg.HapticFeedback.notificationOccurred('success'); // Вибрация
            }, 2000);
        }

        function closeApp() {
            tg.close();
        }

        // --- Эффект "Матрица" ---
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');

        canvas.height = window.innerHeight;
        canvas.width = window.innerWidth;

        const chars = "0123456789ABCDEFGHJKLMNOPQRSTUVWXYZ";
        const fontSize = 14;
        const columns = canvas.width / fontSize;
        const drops = Array(Math.floor(columns)).fill(1);

        function drawMatrix() {
            ctx.fillStyle = "rgba(0, 0, 0, 0.05)";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.fillStyle = "#00ff66";
            ctx.font = fontSize + "px monospace";

            for (let i = 0; i < drops.length; i++) {
                const text = chars.charAt(Math.floor(Math.random() * chars.length));
                ctx.fillText(text, i * fontSize, drops[i] * fontSize);

                if (drops[i] * fontSize > canvas.height && Math.random() > 0.975) {
                    drops[i] = 0;
                }
                drops[i]++;
            }
        }

        setInterval(drawMatrix, 33);
    </script>
</body>
</html>
