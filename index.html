<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>FunPay Escrow</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --primary-blue: #2b82fb;
      --bg-color: #f3f6fb;
      --card-bg: #ffffff;
      --text-color: #1a1a1a;
      --subtext-color: #7d8b9b;
      --border-color: #e6ecf3;
      --input-bg: #f8fafc;
      --danger-red: #ff4d4f;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      min-height: 100vh;
      padding-bottom: 75px;
      position: relative;
      overflow-x: hidden;
    }

    body::before {
      content: "FUNPAY  FUNPAY  FUNPAY  FUNPAY\A FUNPAY  FUNPAY  FUNPAY  FUNPAY\A FUNPAY  FUNPAY  FUNPAY  FUNPAY\A FUNPAY  FUNPAY  FUNPAY  FUNPAY";
      white-space: pre;
      position: fixed;
      top: -50%; left: -50%;
      width: 200%; height: 200%;
      font-size: 26px;
      font-weight: 900;
      color: rgba(43, 130, 251, 0.035);
      transform: rotate(-25deg);
      pointer-events: none;
      z-index: 0;
      line-height: 2.2;
    }

    .container {
      position: relative;
      z-index: 1;
      padding: 16px;
    }

    .tab-page { display: none; }
    .tab-page.active { display: block; }

    h1.page-title {
      font-size: 24px;
      font-weight: 800;
      margin-bottom: 16px;
    }

    .btn-primary {
      background: var(--primary-blue);
      color: #fff;
      width: 100%;
      padding: 16px;
      border-radius: 16px;
      border: none;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      box-shadow: 0 6px 20px rgba(43, 130, 251, 0.25);
    }

    .btn-secondary {
      width: 100%;
      padding: 14px;
      background: var(--input-bg);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      font-size: 15px;
      font-weight: 700;
      color: var(--text-color);
      cursor: pointer;
    }

    .deals-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin: 16px 0;
    }

    .stat-card {
      background: var(--card-bg);
      padding: 16px;
      border-radius: 16px;
      border: 1px solid var(--border-color);
      cursor: pointer;
    }

    .stat-card h3 { font-size: 16px; font-weight: 700; }
    .stat-card p { font-size: 12px; color: var(--subtext-color); }

    .join-card {
      background: var(--card-bg);
      padding: 20px;
      border-radius: 20px;
      border: 1px solid var(--border-color);
      margin-bottom: 16px;
    }

    .join-card label {
      font-size: 12px;
      color: var(--subtext-color);
      margin-bottom: 8px;
      display: block;
    }

    .code-input {
      width: 100%;
      padding: 14px;
      background: var(--input-bg);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      font-size: 16px;
      text-align: center;
      font-weight: 600;
      margin-bottom: 12px;
      outline: none;
    }

    .info-banner {
      font-size: 12px;
      color: var(--subtext-color);
      line-height: 1.5;
    }
    .info-banner a { color: var(--primary-blue); text-decoration: none; font-weight: 600; }

    .bottom-bar {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      background: var(--card-bg);
      display: flex;
      justify-content: space-around;
      padding: 8px 0 12px;
      border-top: 1px solid var(--border-color);
      z-index: 100;
    }

    .nav-tab {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
      color: var(--subtext-color);
      font-size: 11px;
      cursor: pointer;
      width: 25%;
    }

    .nav-tab.active { color: var(--primary-blue); font-weight: 600; }
    .nav-tab svg { width: 22px; height: 22px; fill: currentColor; }

    .currency-scroll {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 8px;
      margin-bottom: 16px;
    }

    .chip {
      padding: 8px 14px;
      background: var(--card-bg);
      border-radius: 20px;
      border: 1px solid var(--border-color);
      font-size: 13px;
      font-weight: 600;
      white-space: nowrap;
      cursor: pointer;
    }

    .chip.active {
      background: var(--primary-blue);
      color: #fff;
      border-color: var(--primary-blue);
    }

    .wallet-card {
      background: var(--card-bg);
      border-radius: 20px;
      padding: 20px;
      border: 1px solid var(--border-color);
      margin-bottom: 16px;
    }

    .modal-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.4);
      z-index: 200;
      display: none;
      align-items: flex-end;
    }
    .modal-overlay.active { display: flex; }

    .modal-content {
      background: var(--card-bg);
      width: 100%;
      border-radius: 24px 24px 0 0;
      padding: 24px 20px;
      position: relative;
      max-height: 85vh;
      overflow-y: auto;
    }

    .modal-close {
      position: absolute;
      top: 16px; right: 16px;
      background: var(--input-bg);
      width: 28px; height: 28px;
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer;
      color: var(--subtext-color);
    }

    .modal-title { font-size: 18px; font-weight: 800; margin-bottom: 4px; }
    .modal-subtitle { font-size: 13px; color: var(--subtext-color); margin-bottom: 16px; }

    .currency-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }
