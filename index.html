    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();

        const BOT_USERNAME = "freezersdemo2_bot";
        let selectedType = "buy";

        if (tg.initDataUnsafe && tg.initDataUnsafe.user) {
            const u = tg.initDataUnsafe.user;
            const name = (u.first_name || '') + ' ' + (u.last_name || '');
            const username = u.username ? `@${u.username}` : '@Freezers1';
            
            document.getElementById('user-name').innerText = name.trim() || 'Пользователь';
            document.getElementById('user-avatar').innerText = (u.first_name || 'F')[0].toUpperCase();
            document.getElementById('user-username').innerText = username;
            document.getElementById('top-username').innerText = username;
        }

        function switchTab(tabName) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));

            document.getElementById(`tab-${tabName}`).classList.add('active');
            document.getElementById(`nav-${tabName}`).classList.add('active');
        }

        function selectCurrency(curr, el) {
            document.querySelectorAll('.currency-selector .chip').forEach(c => c.classList.remove('active'));
            if (el) el.classList.add('active');

            const title = document.getElementById('wallet-card-title');
            const icon = document.getElementById('wallet-coin-icon');
            const name = document.getElementById('wallet-coin-name');
            const val = document.getElementById('wallet-coin-val');

            if (curr === 'TON') {
                title.innerText = "Кошелёк TON"; icon.innerText = "💎"; name.innerText = "Toncoin"; val.innerText = "0.00 TON";
            } else if (curr === 'USDT') {
                title.innerText = "Кошелёк USDT"; icon.innerText = "💵"; name.innerText = "Tether"; val.innerText = "0.00 USDT";
            } else if (curr === 'STARS') {
                title.innerText = "Кошелёк STARS"; icon.innerText = "⭐"; name.innerText = "Telegram Stars"; val.innerText = "0 STARS";
            } else if (curr === 'RUB') {
                title.innerText = "Кошелёк RUB"; icon.innerText = "₽"; name.innerText = "Рубли"; val.innerText = "0.00 ₽";
            }
        }

        function openModal() {
            document.getElementById('modal-create').classList.add('active');
            document.getElementById('create-form').style.display = 'none';
        }

        function closeModal() {
            document.getElementById('modal-create').classList.remove('active');
        }

        function selectType(type) {
            selectedType = type;
            document.getElementById('create-form').style.display = 'block';
        }

        function finishCreateDeal() {
            const amount = document.getElementById('deal-amount').value;
            const curr = document.getElementById('deal-currency').value;

            if (!amount || amount <= 0) {
                tg.showAlert("Введите корректную сумму");
                return;
            }

            // Генерация уникального кода сделки
            const dealId = Math.random().toString(36).substring(2, 8).toUpperCase();
            
            const data = {
                action: "create_deal",
                deal_id: dealId,
                amount: amount,
                currency: curr
            };

            // Передача данных в Python-бот и закрытие WebApp
            tg.sendData(JSON.stringify(data));
        }

        function joinDeal() {
            const code = document.getElementById('deal-code-input').value.trim().toUpperCase();
            if (!code) {
                tg.showAlert("Введите код заказа");
                return;
            }
            tg.openTelegramLink(`https://t.me/${BOT_USERNAME}?start=code_${code}`);
            tg.close();
        }

        function actionWallet(type) {
            tg.showAlert(`Для операций с балансом обратитесь к гаранту @Freezers1`);
        }
    </script>
