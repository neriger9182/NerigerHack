<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>freezers — Гарант Сервис</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-color: #0b0e14;
            --card-bg: #151b26;
            --accent-color: #0088cc;
            --text-main: #ffffff;
            --text-secondary: #8a99ad;
            --border-color: #232d3f;
            --success-color: #00c853;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-main); padding-bottom: 70px; }

        .app-header { background-color: var(--card-bg); padding: 16px; text-align: center; border-bottom: 1px solid var(--border-color); }
        .container { padding: 16px; }
        .tab-content { display: none; }
        .tab-content.active { display: block; }

        .bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; background-color: var(--card-bg); display: flex; padding: 10px 0; border-top: 1px solid var(--border-color); }
        .nav-item { display: flex; flex-direction: column; align-items: center; color: var(--text-secondary); font-size: 11px; width: 33%; cursor: pointer; }
        .nav-item.active { color: var(--accent-color); }

        .card { background-color: var(--card-bg); border-radius: 14px; padding: 16px; margin-bottom: 16px; border: 1px solid var(--border-color); }
        .btn { width: 100%; padding: 12px; border: none; border-radius: 10px; background-color: var(--accent-color); color: #fff; font-weight: bold; cursor: pointer; }
        .btn-pay { background-color: #eab308; color: #000; margin-top: 8px; }
        .btn-secondary { background-color: #232d3f; color: #fff; }

        .form-group { margin-bottom: 14px; }
        .form-group label { display: block; font-size: 13px; color: var(--text-secondary); margin-bottom: 6px; }
        .form-group input { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid var(--border-color); background-color: var(--bg-color); color: #fff; }

        .deal-item { padding: 12px 0; border-bottom: 1px solid var(--border-color); }
        .modal { display: none; position: fixed; top:0; left:0; right:0; bottom:0; background: rgba(0,0,0,0.8); align-items: center; justify-content: center; padding: 16px; }
        .modal.active { display: flex; }
        .modal-content { background: var(--card-bg); border-radius: 16px; padding: 20px; width: 100%; }
    </style>
</head>
<body>

    <div class="app-header">
        <h1>❄️ freezers</h1>
        <p id="user-info">Загрузка...</p>
    </div>

    <div class="container">
        <!-- Вкладка Сделки -->
        <div id="tab-deals" class="tab-content active">
            <button class="btn" onclick="openModal('create-modal')">➕ Создать сделку</button>
            <div class="card" style="margin-top: 16px;">
                <div style="font-size: 16px; font-weight: bold; margin-bottom: 12px;">Мои сделки</div>
                <div id="deals-list"><p style="color: var(--text-secondary); font-size: 13px;">У вас нет активных сделок.</p></div>
            </div>
        </div>

        <!-- Вкладка Кошелек -->
        <div id="tab-wallet" class="tab-content">
            <div class="card" style="text-align: center;">
                <span style="color: var(--text-secondary);">Оплата через</span>
                <h2 style="color: var(--accent-color); margin: 10px 0;">Telegram Stars ⭐</h2>
                <p style="font-size: 12px; color: var(--text-secondary);">Оплата счетов происходит напрямую через Telegram.</p>
            </div>
        </div>

        <!-- Вкладка Профиль -->
        <div id="tab-profile" class="tab-content">
            <div class="card">
                <h3>Профиль</h3><br>
                <p>Пользователь: <strong id="profile-name">---</strong></p>
                <p style="margin-top: 8px;">Гарант: <strong>@freezers1</strong></p>
            </div>
        </div>
    </div>

    <!-- Модалка -->
    <div id="create-modal" class="modal">
        <div class="modal-content">
            <h3>Создание сделки</h3><br>
            <div class="form-group">
                <label>Предмет/Услуга</label>
                <input type="text" id="deal-title" placeholder="Описание">
            </div>
            <div class="form-group">
                <label>Сумма в Звёздах (⭐ Stars)</label>
                <input type="number" id="deal-amount" placeholder="10">
            </div>
            <div style="display: flex; gap: 10px;">
                <button class="btn btn-secondary" onclick="closeModal('create-modal')">Отмена</button>
                <button class="btn" onclick="submitDeal()">Создать</button>
            </div>
        </div>
    </div>

    <!-- Навигация -->
    <div class="bottom-nav">
        <div class="nav-item active" onclick="switchTab('deals', this)"><span>Сделки</span></div>
        <div class="nav-item" onclick="switchTab('wallet', this)"><span>Кошелек</span></div>
        <div class="nav-item" onclick="switchTab('profile', this)"><span>Профиль</span></div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.ready(); tg.expand();

        const user = tg.initDataUnsafe?.user;
        if (user) {
            document.getElementById('user-info').innerText = `@${user.username || user.first_name}`;
            document.getElementById('profile-name').innerText = user.first_name;
        }

        function switchTab(tabName, el) {
            document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(i => i.classList.remove('active'));
            document.getElementById('tab-' + tabName).classList.add('active');
            el.classList.add('active');
        }

        function openModal(id) { document.getElementById(id).classList.add('active'); }
        function closeModal(id) { document.getElementById(id).classList.remove('active'); }

        function loadDeals() {
            const list = document.getElementById('deals-list');
            const deals = JSON.parse(localStorage.getItem('frz_deals_v2') || '[]');

            if (deals.length === 0) {
                list.innerHTML = '<p style="color: var(--text-secondary); font-size: 13px;">У вас нет активных сделок.</p>';
                return;
            }

            list.innerHTML = '';
            deals.forEach((deal, index) => {
                const item = document.createElement('div');
                item.className = 'deal-item';
                item.innerHTML = `
                    <div style="display: flex; justify-content: space-between;">
                        <strong>${deal.title}</strong>
                        <span style="color: #eab308; font-weight: bold;">⭐ ${deal.amount} Stars</span>
                    </div>
                    <button class="btn btn-pay" onclick="payDeal(${index})">Оплатить ⭐ ${deal.amount}</button>
                `;
                list.appendChild(item);
            });
        }

        function submitDeal() {
            const title = document.getElementById('deal-title').value.trim();
            const amount = document.getElementById('deal-amount').value.trim();

            if (!title || !amount) {
                tg.showAlert("Заполните поля!");
                return;
            }

            const deals = JSON.parse(localStorage.getItem('frz_deals_v2') || '[]');
            deals.unshift({ title, amount });
            localStorage.setItem('frz_deals_v2', JSON.stringify(deals));

            closeModal('create-modal');
            document.getElementById('deal-title').value = '';
            document.getElementById('deal-amount').value = '';
            loadDeals();
        }

        function payDeal(index) {
            const deals = JSON.parse(localStorage.getItem('frz_deals_v2') || '[]');
            const deal = deals[index];

            tg.sendData(JSON.stringify({
                action: "pay_stars",
                title: deal.title,
                amount: deal.amount
            }));

            tg.close();
        }

        loadDeals();
    </script>
</body>
</html>
