<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>freezers</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root { --bg-color: #0d1117; --card-bg: #161b22; --text-main: #f0f6fc; --text-sub: #8b949e; --accent-btn: #2f81f7; --border-color: #30363d; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-main); padding: 16px; }
        .header-title { font-size: 24px; font-weight: 800; margin-bottom: 16px; }
        .card { background: var(--card-bg); border-radius: 18px; padding: 18px; margin-bottom: 12px; border: 1px solid var(--border-color); }
        .card-title { font-size: 13px; color: var(--text-sub); margin-bottom: 6px; }
        .btn-main { width: 100%; background: var(--accent-btn); color: #fff; border: none; padding: 14px; border-radius: 14px; font-size: 15px; font-weight: 700; cursor: pointer; margin-bottom: 8px; }
        .btn-sub { width: 100%; background: #21262d; color: var(--text-main); border: 1px solid var(--border-color); padding: 14px; border-radius: 14px; font-size: 15px; font-weight: 700; cursor: pointer; }
        .modal { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.75); align-items: center; justify-content: center; padding: 16px; z-index: 200; }
        .modal.active { display: flex; }
        .modal-body { background: var(--card-bg); border-radius: 20px; padding: 20px; width: 100%; max-width: 360px; border: 1px solid var(--border-color); }
        .input-field { width: 100%; padding: 12px; background: #0d1117; border: 1px solid var(--border-color); color: var(--text-main); border-radius: 10px; font-size: 15px; margin: 8px 0 14px 0; outline: none; }
    </style>
</head>
<body>

    <h1 class="header-title">Сделки freezers</h1>
    <button class="btn-main" onclick="openCreateModal()">+ Создать сделку</button>

    <div class="card" style="margin-top: 15px;">
        <div class="card-title">Присоединиться по коду</div>
        <input type="text" id="deal-code-input" placeholder="Введите 6-значный код" class="input-field" style="text-align: center; text-transform: uppercase;">
        <button class="btn-sub" onclick="joinDeal()">Войти в сделку</button>
    </div>

    <!-- Модальное окно -->
    <div id="create-modal" class="modal">
        <div class="modal-body">
            <h3>Создание сделки</h3>
            <label class="card-title">Название товара</label>
            <input type="text" id="deal-title" class="input-field" placeholder="Например: Telegram Premium">
            
            <label class="card-title">Цена</label>
            <input type="number" id="deal-price" class="input-field" placeholder="100">
            
            <label class="card-title">Валюта</label>
            <select id="deal-currency" class="input-field">
                <option value="ton">💎 TON</option>
                <option value="usdt">💵 USDT</option>
                <option value="stars">⭐ STARS</option>
                <option value="rub">₽ RUB</option>
            </select>

            <button class="btn-main" onclick="submitCreate()">Создать сделку</button>
            <button class="btn-sub" onclick="closeCreateModal()">Отмена</button>
        </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.ready(); tg.expand();

        function openCreateModal() { document.getElementById('create-modal').classList.add('active'); }
        function closeCreateModal() { document.getElementById('create-modal').classList.remove('active'); }

        function submitCreate() {
            const title = document.getElementById('deal-title').value.trim();
            const price = document.getElementById('deal-price').value.trim();
            const currency = document.getElementById('deal-currency').value;

            if(!title || !price || price <= 0) {
                tg.showAlert("Заполните все поля");
                return;
            }

            // Прямой переход через deep-link бота (не зависит от ограничений Telegram)
            const cleanTitle = encodeURIComponent(title.replace(/_/g, " "));
            const link = `https://t.me/freezersdemi2_bot?start=create_${cleanTitle}_${price}_${currency}`;
            
            tg.openTelegramLink(link);
            tg.close();
        }

        function joinDeal() {
            const code = document.getElementById('deal-code-input').value.trim().toUpperCase();
            if(!code) return;

            const link = `https://t.me/freezersdemi2_bot?start=code_${code}`;
            tg.openTelegramLink(link);
            tg.close();
        }
    </script>
</body>
</html>
